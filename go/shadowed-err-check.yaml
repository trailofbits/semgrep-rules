rules:
  - id: shadowed-err-check
    languages: [go]
    severity: ERROR
    message: >-
      The `if` statement declares an error-like variable but then checks a
      different variable against `nil`. This is almost always a copy-paste /
      typo bug: the error returned by the function call in the init clause is
      silently ignored, while a stale variable from an outer scope is checked
      instead.
    metadata:
      category: security
      cwe: "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      subcategory: [audit]
      confidence: MEDIUM
      likelihood: HIGH
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Shadowed error variable: declared `err` is not the one checked against `nil`"
      references:
        - https://temporal.io/blog/go-shadowing-bad-choices#the-bug
    patterns:
      # Match any `if <decl> := <expr>; <check> <op> nil { ... }` where the
      # declared variable and the variable in the check are both error-like.
      - pattern-either:
          - pattern: |
              if $LOCAL := $EXPR; $CHECK != nil {
                ...
              }
          - pattern: |
              if $LOCAL := $EXPR; $CHECK == nil {
                ...
              }
          - pattern: |
              if ..., $LOCAL := $EXPR; $CHECK != nil {
                ...
              }
          - pattern: |
              if ..., $LOCAL := $EXPR; $CHECK == nil {
                ...
              }
      # Both the declared variable and the variable being checked must look
      # like error variables. This focuses the rule on the real bug class
      # (shadowed/typo'd error checks) and avoids false positives from
      # legitimate uses such as `if v, ok := m[k]; ok { ... }`. The regex
      # matches `e`, `err`, `err\d*`, `errFoo` (err prefix + CamelCase),
      # and `xErr` / `parseError` style names while rejecting accidental
      # substring matches like `terraform`.
      - metavariable-regex:
          metavariable: $LOCAL
          regex: ^(e|err\d*|error|err[A-Z][a-zA-Z0-9]*|[a-z][a-zA-Z0-9]*Err[a-zA-Z0-9]*|[a-z][a-zA-Z0-9]*Error[a-zA-Z0-9]*)$
      - metavariable-regex:
          metavariable: $CHECK
          regex: ^(e|err\d*|error|err[A-Z][a-zA-Z0-9]*|[a-z][a-zA-Z0-9]*Err[a-zA-Z0-9]*|[a-z][a-zA-Z0-9]*Error[a-zA-Z0-9]*)$
      # Subtract the correct case: when the declared variable IS the variable
      # being checked. `pattern-not` enforces this via metavariable
      # unification — `$SAME` must be identical on both sides.
      - pattern-not: |
          if $SAME := $E; $SAME != nil {
            ...
          }
      - pattern-not: |
          if $SAME := $E; $SAME == nil {
            ...
          }
      - pattern-not: |
          if ..., $SAME := $E; $SAME != nil {
            ...
          }
      - pattern-not: |
          if ..., $SAME := $E; $SAME == nil {
            ...
          }
