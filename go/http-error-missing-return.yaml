rules:
  # Two cases under one id:
  #   Case A — http.Error is the tail of its block, and the enclosing
  #     if-chain or switch is followed by another statement.
  #   Case B — http.Error is directly followed by a statement.
  # Subtractions for terminator-after-error are kept at top level because
  # Semgrep silently ignores `pattern-not` / `metavariable-regex` when
  # nested under `pattern-either > patterns`. The Case A subtraction also
  # carries an extra `pattern-not http.Error(...)\n$ANY` so it doesn't
  # over-subtract Case B matches.
  - id: http-error-missing-return
    languages: [go]
    severity: ERROR
    message: >-
      `http.Error` writes a complete response but does not stop handler
      execution. When the call is not followed by `return` (or another
      terminating statement), the handler keeps running, potentially writing
      additional response bytes, performing actions that should have been
      gated by the response, or producing a malformed/duplicated response.
      Add a `return` immediately after the call, or otherwise terminate the
      control flow.
    metadata:
      category: security
      cwe: "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Missing `return` after `http.Error` lets the handler continue executing"
      references:
        - https://pkg.go.dev/net/http#Error
    patterns:
      # Anchor to files importing net/http so `http.Error` resolves to stdlib.
      - pattern-inside: |
          import "net/http"
          ...
      - pattern: http.Error(...)
      - pattern-either:
          # Case A. With nested chains, $NEXT binds to the trailing stmt of
          # the outermost containing structure, so deep else-if chains work
          # without explicit case enumeration.
          - patterns:
              - pattern-not-inside: |
                  http.Error(...)
                  $ANY
              - pattern-either:
                  - pattern-inside: |
                      if $C1 {
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      if $I1; $C1 {
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch $X1 {
                      case $L1:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch $I1; $X1 {
                      case $L1:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch {
                      case $L1:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch $X1 {
                      default:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch {
                      default:
                          ...
                      }
                      $NEXT
          # Case B.
          - pattern-inside: |
              http.Error(...)
              $STMT
      # Subtract Case B: http.Error directly followed by a terminator.
      - pattern-not-inside:
          patterns:
            - pattern: |
                http.Error(...)
                $TERM
            - metavariable-regex:
                metavariable: $TERM
                regex: '^(return\b|panic\(|log\.Fatal(ln|f)?\(|os\.Exit\(|runtime\.Goexit\(|continue\b|break\b|goto\b)'
      # Subtract Case A: enclosing if-chain or switch is followed by a
      # terminator AND http.Error is the tail of its block. The tail-of-block
      # conjunction prevents subtracting Case B matches whose enclosing
      # structure also happens to be followed by a terminator.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    if $C2 {
                        ...
                    }
                    $TERM
                - pattern: |
                    if $I2; $C2 {
                        ...
                    }
                    $TERM
                - pattern: |
                    switch $X2 {
                    case $L2:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch $I2; $X2 {
                    case $L2:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch {
                    case $L2:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch $X2 {
                    default:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch {
                    default:
                        ...
                    }
                    $TERM
            - metavariable-regex:
                metavariable: $TERM
                regex: '^(return\b|panic\(|log\.Fatal(ln|f)?\(|os\.Exit\(|runtime\.Goexit\(|continue\b|break\b|goto\b)'
            - pattern-not: |
                http.Error(...)
                $ANY
