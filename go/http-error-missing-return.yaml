rules:
  # The rule has two cases combined under one user-facing id:
  #
  #   Case A — `http.Error` is the tail of its containing block, and the
  #     enclosing if-chain or switch is followed by another statement.
  #   Case B — `http.Error` is immediately followed by a statement in the
  #     same block (regardless of nesting context).
  #
  # The two cases are joined under a top-level `pattern-either`, then
  # two top-level `pattern-not-inside` subtractions drop matches where
  # the trailing statement is a control-flow terminator. The two
  # subtractions are kept separate because they need different scoping:
  #
  #   - The Case B subtraction (`http.Error(...)\n$TERM`) is shape-safe
  #     at the top level: the shape only matches Case B-style instances
  #     (where http.Error has a directly-following stmt), so it cannot
  #     wrongly subtract Case A matches.
  #   - The Case A subtraction (enclosing if/switch followed by $TERM)
  #     would over-subtract Case B matches whose enclosing structure
  #     also happens to be followed by a terminator. It is scoped to
  #     Case A by an extra `pattern-not http.Error(...)\n$ANY`
  #     conjunction (i.e., http.Error must be the tail of its block).
  #
  # Top-level placement of both subtractions is required because
  # Semgrep silently ignores `pattern-not` / `pattern-not-inside` /
  # `metavariable-regex` when nested under `pattern-either > patterns`.
  - id: http-error-missing-return
    languages: [go]
    severity: ERROR
    message: >-
      `http.Error` writes a complete response but does not stop handler
      execution. When the call is not followed by `return` (or another
      terminating statement), the handler keeps running, potentially writing
      additional response bytes, performing actions that should have been
      gated by the response, or producing a malformed/duplicated response.
      Add a `return` immediately after the call, or otherwise terminate the
      control flow.
    metadata:
      category: security
      cwe: "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Missing `return` after `http.Error` lets the handler continue executing"
      references:
        - https://pkg.go.dev/net/http#Error
    patterns:
      # Anchor: the file imports `net/http`, so `http.Error` resolves to
      # the stdlib symbol rather than a local identifier shadowing it.
      - pattern-inside: |
          import "net/http"
          ...
      - pattern: http.Error(...)
      - pattern-either:
          # Case A — http.Error is the tail of its containing block, and
          # the enclosing if-chain or switch is followed by $NEXT. With
          # nested chains $NEXT naturally binds to the trailing stmt of
          # the outermost containing structure, so deep else-if chains
          # work without explicit case enumeration.
          - patterns:
              - pattern-not-inside: |
                  http.Error(...)
                  $ANY
              - pattern-either:
                  - pattern-inside: |
                      if $C1 {
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      if $I1; $C1 {
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch $X1 {
                      case $L1:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch $I1; $X1 {
                      case $L1:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch {
                      case $L1:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch $X1 {
                      default:
                          ...
                      }
                      $NEXT
                  - pattern-inside: |
                      switch {
                      default:
                          ...
                      }
                      $NEXT
          # Case B — http.Error is directly followed by another stmt in
          # the same block.
          - pattern-inside: |
              http.Error(...)
              $STMT
      # Subtract Case B: http.Error directly followed by a control-flow
      # terminator (return / panic / log.Fatal* / os.Exit /
      # runtime.Goexit / continue / break / goto).
      - pattern-not-inside:
          patterns:
            - pattern: |
                http.Error(...)
                $TERM
            - metavariable-regex:
                metavariable: $TERM
                regex: '^(return\b|panic\(|log\.Fatal(ln|f)?\(|os\.Exit\(|runtime\.Goexit\(|continue\b|break\b|goto\b)'
      # Subtract Case A: enclosing if-chain or switch is followed by a
      # control-flow terminator AND http.Error is the tail of its block.
      # The tail-of-block conjunction prevents this subtraction from
      # firing on Case B matches whose enclosing structure happens to
      # also be followed by a terminator.
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    if $C2 {
                        ...
                    }
                    $TERM
                - pattern: |
                    if $I2; $C2 {
                        ...
                    }
                    $TERM
                - pattern: |
                    switch $X2 {
                    case $L2:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch $I2; $X2 {
                    case $L2:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch {
                    case $L2:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch $X2 {
                    default:
                        ...
                    }
                    $TERM
                - pattern: |
                    switch {
                    default:
                        ...
                    }
                    $TERM
            - metavariable-regex:
                metavariable: $TERM
                regex: '^(return\b|panic\(|log\.Fatal(ln|f)?\(|os\.Exit\(|runtime\.Goexit\(|continue\b|break\b|goto\b)'
            - pattern-not: |
                http.Error(...)
                $ANY
